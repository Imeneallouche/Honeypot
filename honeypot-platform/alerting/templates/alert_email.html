<!DOCTYPE html>
<html>
<head><meta charset='utf-8'><title>Honeypot Alert</title></head>
<body style='font-family:Inter,Segoe UI,sans-serif;background:#0a0e1a;color:#e6f1ff;padding:24px'>
  <h2 style='color:#00d4ff'>Honeypot Command Center Alert</h2>
  <table style='border-collapse:collapse;background:#111827;padding:16px;border-radius:8px'>
    <tr><td><strong>Severity</strong></td><td>{{SEVERITY}}</td></tr>
    <tr><td><strong>Rule</strong></td><td>{{RULE}}</td></tr>
    <tr><td><strong>Source IP</strong></td><td>{{IP}}</td></tr>
    <tr><td><strong>Triggered</strong></td><td>{{TIME}}</td></tr>
    <tr><td><strong>Session</strong></td><td>{{SESSION}}</td></tr>
  </table>
  <pre style='background:#070b14;color:#00ff88;padding:16px;border-radius:8px'>{{DESCRIPTION}}</pre>
</body>
</html>
